# Validate the Worker build on every PR / push (does not deploy).
# Cloudflare "Workers Builds: slam" is a separate Git integration; keep its
# Build command as `npm run build` and Non-production deploy as
# `npm run deploy:preview` (see README).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # Optional at build time; missing values only affect runtime URLs.
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL || 'https://example.convex.cloud' }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'http://127.0.0.1:3000' }}
      # Confirms the Vite plugin emitted deploy config that wrangler can read.
      - run: npx wrangler versions upload --dry-run
